<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>TravelBloom – Contact Us</title>
  <link rel="stylesheet" href="style.css" />

  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com"/>
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700;900&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet"/>

  <!-- Font Awesome CDN -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css"/>
</head>
<body>
    <header class="navbar">
        <div class="nav-logo">
          <div class="logo-icon">
            <i class="fa-solid fa-earth-americas"></i>
          </div>
          <span class="logo-text">TravelBloom</span>
        </div>
    
        <nav class="nav-links">
          <a href="travel_recommendation.html">Home</a>
          <a href="about_us.html">About Us</a>
          <a href="contact_us.html">Contact Us</a>
        </nav>
    
        <div class="nav-search">
          <div class="search-bar">
            <i class="fa-solid fa-magnifying-glass search-icon"></i>
            <input type="text" placeholder="Enter a destination or keyword" />
          </div>
          <button class="btn-search">Search</button>
          <button class="btn-clear">Clear</button>
        </div>
      </header>
  <!-- ══ CONTACT HERO ══ -->
  <section class="contact-hero">
    <div class="hero-overlay"></div>

    <aside class="social-sidebar">
      <a href="#" class="social-link" aria-label="Twitter"><i class="fa-brands fa-x-twitter"></i></a>
      <a href="#" class="social-link" aria-label="Facebook"><i class="fa-brands fa-facebook-f"></i></a>
      <a href="#" class="social-link" aria-label="Instagram"><i class="fa-brands fa-instagram"></i></a>
      <a href="#" class="social-link" aria-label="YouTube"><i class="fa-brands fa-youtube"></i></a>
    </aside>

    <div class="contact-layout">

      <!-- Left: title -->
      <div class="contact-info">
        <h1 class="contact-title">Contact Us</h1>
        <p class="contact-subtitle">Get in touch</p>
      </div>

      <!-- Right: form -->
      <div class="contact-card">
        <div class="form-group">
          <label for="name">Name</label>
          <input type="text" id="name" name="name" placeholder="Enter your name" />
        </div>

        <div class="form-group">
          <label for="email">Email</label>
          <input type="email" id="email" name="email" placeholder="Enter your email" />
        </div>

        <div class="form-group">
          <label for="message">Message</label>
          <textarea id="message" name="message" placeholder="Enter your message"></textarea>
        </div>

        <button class="btn-submit" type="button">Submit</button>
      </div>

    </div>
  </section>

</body>
</html>
